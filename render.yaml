# Render Blueprint for Nonstop. Deploy from the PRIVATE deploy repo, which also carries the prepared
# data bundle (data/derived, .cache/features, data/raw/airports.csv). The public repo has code only,
# because the hackathon rules forbid publishing Qloo data.
# Only the API runs here; the website is on Vercel (https://nonstopapp.vercel.app), with
# NEXT_PUBLIC_API_URL pointing at this service. Use Starter or above during judging (no sleep).
services:
  - type: web
    name: nonstop-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn nonstop.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: QLOO_API_KEY
        sync: false        # paste in the Render dashboard; never committed
      - key: DEEPSEEK_API_KEY
        sync: false

